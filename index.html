<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess the Number!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <h1>Guess the Number!</h1>

        <p>Guess a number between 1 and 20.</p>

        <div class="score-board">
            <p>Attempts Left: <span id="attempts">5</span></p>
            <p>Score: <span id="score">0</span></p>
        </div>

        <input
            type="number"
            id="guessInput"
            min="1"
            max="20"
            placeholder="Enter your guess"
        >

        <button id="checkBtn">Check Guess</button>
        <button id="playAgainBtn" hidden>Play Again</button>

        <p id="message" aria-live="polite">Good luck! 🎯</p>
    </div>
    <script src="script.js"></script>
</body>
</html>
